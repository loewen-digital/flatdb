# Agent loop. Claude runs on the CI login's subscription (org secret CLAUDE_CODE_OAUTH_TOKEN).
#   issue gets label `ready`          -> implement it, open a PR
#   review lands on a claude/* PR     -> address it
#   "@claude" in a comment            -> do what the comment says
# What Claude does is defined in CLAUDE.md, section "Agent Loop".
name: Agent

on:
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  agent:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'ready') ||
      (github.event_name == 'pull_request_review' && github.event.review.state != 'approved' && startsWith(github.event.pull_request.head.ref, 'claude/')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: 22
          cache: npm
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      # The secret may carry a trailing newline from an interactive paste; the API rejects that.
      - name: Trim OAuth token
        id: tok
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          t=$(printf '%s' "$T" | tr -d '[:space:]')
          echo "::add-mask::$t"
          echo "token=$t" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.tok.outputs.token }}
          allowed_bots: "chatgpt-codex-connector[bot],chatgpt-codex-connector,claude[bot],claude"
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5
            --max-turns 250
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(gh:*),Bash(git:*),Read,Write,Edit,Glob,Grep,WebFetch"
          prompt: >-
            ${{ github.event_name == 'issues'
                && format('Issue #{0} has the label ready. Follow CLAUDE.md, section "Agent Loop", part "Issue".', github.event.issue.number)
                || github.event_name == 'pull_request_review'
                && format('A review was submitted on PR #{0}. Follow CLAUDE.md, section "Agent Loop", part "Review".', github.event.pull_request.number)
                || '' }}
      - name: Request Codex review
        if: github.event_name == 'issues' || github.event_name == 'pull_request_review'
        env:
          T: ${{ secrets.CODEX_TRIGGER_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ISSUE: ${{ github.event.issue.number }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.pull_request.head.sha }}
        run: |
          GH_TOKEN=$(printf '%s' "$T" | tr -d '[:space:]')
          if [ -z "$GH_TOKEN" ]; then echo "CODEX_TRIGGER_TOKEN not set, skipping"; exit 0; fi
          echo "::add-mask::$GH_TOKEN"; export GH_TOKEN
          if [ "$EVENT" = issues ]; then
            n=$(gh pr list --state open --json number,headRefName,isDraft --jq ".[] | select(.isDraft | not) | select(.headRefName | startswith(\"claude/issue-$ISSUE-\")) | .number" | head -1)
          else
            n=$PR
            if [ "$(gh pr view "$n" --json headRefOid --jq .headRefOid)" = "$BEFORE" ]; then n=; fi
          fi
          if [ -n "$n" ]; then gh pr comment "$n" --body '@codex review'; echo "requested Codex review on #$n"; else echo "no PR to review"; fi
